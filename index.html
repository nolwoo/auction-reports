<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경매물건 분석 리포트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', Pretendard, sans-serif; background: #f5f6f8; color: #1a1d21; padding: 40px 20px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 26px; margin-bottom: 6px; }
  .sub { color: #667085; margin-bottom: 28px; font-size: 14px; }
  h2 { font-size: 18px; margin: 28px 0 14px; }
  .report { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; text-decoration: none; color: inherit; transition: .15s; }
  .report:hover { border-color: #2e5cff; box-shadow: 0 2px 8px rgba(46,92,255,.08); }
  .report .t { font-weight: 600; font-size: 15px; }
  .report .m { font-size: 13px; color: #667085; margin-top: 3px; }
  .report .d { font-size: 12px; color: #98a2b3; white-space: nowrap; margin-left: 16px; }
  .empty { color: #98a2b3; font-size: 14px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏠 경매물건 분석 리포트</h1>
  <p class="sub">경매지 PDF를 AI가 분석한 리포트 모음입니다</p>

  <h2>📋 분석 리포트</h2>
  <div id="list"><div class="empty">아직 리포트가 없습니다</div></div>
</div>

<script>
async function loadReports() {
  try {
    const res = await fetch("reports/index.json", { cache: "no-store" });
    if (!res.ok) return;
    const items = await res.json();
    const list = document.getElementById("list");
    if (!items.length) return;
    list.innerHTML = items.map(r => `
      <div class="report">
        <div style="flex:1;min-width:0">
          <a href="reports/${r.slug}.html" style="text-decoration:none;color:inherit">
            <div class="t">${r.title}</div><div class="m">${r.summary || ""}</div>
          </a>
        </div>
        <div style="text-align:right;margin-left:16px;white-space:nowrap">
          <div class="d">${new Date(r.createdAt).toLocaleString("ko-KR")}</div>
        </div>
      </div>`).join("");
  } catch {}
}
loadReports();
</script>
</body>
</html>
